name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - bugfix
          - feature
          - major

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases must be created from the main branch"
            exit 1
          fi

      - name: Calculate new version
        id: version
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1 || echo "v0.0.0")
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          MAJOR=$(echo "$LATEST" | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1/')
          MINOR=$(echo "$LATEST" | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\2/')
          PATCH=$(echo "$LATEST" | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\3/')
          case "${{ inputs.release_type }}" in
            major)   NEW_VERSION="$((MAJOR+1)).0.0" ;;
            feature) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            bugfix)  NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Update Cargo.toml version
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' Cargo.toml

      - name: Update CHANGES.md
        run: |
          DATE=$(date +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.version }}"
          # Move the `## Unreleased` block (everything up to the next `## <version>`
          # heading, or EOF) into a new `## <version> - <date>` section and reset
          # Unreleased to empty subsections. Block-boundary match (not per-subsection)
          # so blank lines before ### Changed/### Fixed and a missing trailing version
          # section (the first release) are handled correctly.
          perl -i -0777 -pe '
            s{^\#\# Unreleased\n(.*?)(?=\n\#\# |\z)}{
              "## Unreleased\n\n### New\n\n### Changed\n\n### Fixed\n\n" .
              "## '"$VERSION"' - '"$DATE"'\n$1"
            }gmse' CHANGES.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml CHANGES.md
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin main --tags

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            package: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            package: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            RUSTFLAGS="-C target-feature=+crt-static" cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Create tarball
        run: |
          mkdir -p dist staging/ansidrama
          BINARY="target/${{ matrix.target }}/release/ansidrama"
          ARCHIVE="ansidrama-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          cp "$BINARY" staging/ansidrama/
          mkdir -p staging/ansidrama/man
          cp man/ansidrama.1 staging/ansidrama/man/
          cp README.md LICENSE-MIT staging/ansidrama/
          tar -czvf "dist/${ARCHIVE}" -C staging ansidrama
        shell: bash

      - name: Build deb and rpm
        if: matrix.package
        run: |
          cargo install cargo-deb --version '^3.7'
          cargo install cargo-generate-rpm --version '^0.21'
          cargo deb --no-build --no-strip --target ${{ matrix.target }}
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb dist/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansidrama-${{ matrix.target }}
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: [version, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ansidrama-*
          merge-multiple: true

      - name: Extract release notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Print this version's section up to the next `## <version>` heading.
          # Drop that trailing heading — but ONLY if the last printed line IS one:
          # for the last section in the file (e.g. the first-ever release) the range
          # runs to EOF, so a blind `$d` would delete real content (### Fixed).
          sed -n "/^## ${VERSION}/,/^## [0-9]/p" CHANGES.md | sed '${/^## [0-9]/d}' > release-notes.md
          echo "Release notes:"; cat release-notes.md

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ansidrama ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
