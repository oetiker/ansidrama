# Outer trailer: drive bash through the self-referential demo.
# `out` is relative to this file's dir (demo/): ../docs/demo → docs/demo/.
# PS1 as a prefix on the inner shell so it beats /etc/profile (an env-table PS1
# is overridden by the outer login shell before this interactive bash starts).
launch  = "PS1='$ ' bash --norc --noprofile -i"
cols    = 84
rows    = 22
font_px = 18
card_font_px = 40
out     = "../docs/demo/ansidrama.webp"
env     = { COLORTERM = "truecolor" }
# Pacing is per-scene now, not one global window: each input waits only until
# the screen has actually moved and then held still (change_ms + stable_ms),
# bounded by wait_cap_ms — so the ordinary beats below cost milliseconds, not
# seconds. The middle beat is the exception: it runs a REAL
# `ansidrama record hello.toml` as a child process, which takes a few seconds
# (longer on a loaded machine) and is silent for stretches of that while it
# renders. No timing rule can tell that silence from "finished", so that scene
# declares what finishing LOOKS like with `await` instead of guessing.
quit_keys = ["C-d"]

# Frame the whole trailer as a macOS terminal window, with padding.
[chrome]
style   = "macos"
title   = "AnsiDrama"
padding = 12

[[scene]]
card    = { lines = ["AnsiDrama", "no browser · no ffmpeg · no tmux"], fg = "#fef9c3" }
hold_cs = 300

# Reveal the (real, colourised) inner script.
[[scene]]
text    = "cat hello.toml"
hold_cs = 40
[[scene]]
keys    = ["Enter"]
hold_cs = 250

# Run it for real — the OK: line is genuine output.
[[scene]]
text    = "ansidrama record hello.toml"
hold_cs = 40
[[scene]]
keys     = ["Enter"]
# Say what "done" looks like rather than waiting out a guess: this scene ends
# when the child's own "OK: wrote" line is on screen, and fails loudly if it
# never appears. The pattern is a regex, but needs no escaping as written, and
# is deliberately NOT row-scoped: the shell scrolls, so that line has no fixed
# row. With `await` set the bound is await_ms, not wait_cap_ms — measured at
# ~5s on an idle machine, so this leaves an order of magnitude of headroom for
# a loaded one. Too tight a bound would turn a working demo into a hard abort.
await    = "OK: wrote"
await_ms = 60000
hold_cs  = 450

# Show the file it made.
[[scene]]
text    = "ls -l hello.webp"
hold_cs = 40
[[scene]]
keys    = ["Enter"]
hold_cs = 250

[[scene]]
card    = { text = "a star is born", fg = "#fef9c3" }
hold_cs = 350
