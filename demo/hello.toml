# Inner demo: a tiny, real `record` run driven by printf (no recursion).
# `out` is relative to this file's dir (demo/), so hello.webp lands in demo/.
launch  = "bash --norc --noprofile -i"
cols    = 64
rows    = 10
font_px = 18
out     = "hello.webp"
env     = { PS1 = "$ ", COLORTERM = "truecolor" }
settle_ms = 40    # let each keystroke settle before capture (kept < readme.toml's settle_ms)
startup_ms = 1500 # floor: wait for bash's first prompt before typing (avoids a prompt race)
quit_keys = ["C-d"]

# Dress the recording as a macOS terminal window with a little breathing room.
[chrome]
style   = "macos"
title   = "AnsiDrama"
padding = 12

[[scene]]
card    = { text = "hello, world", fg = "#fef9c3" }
hold_cs = 150

[[scene]]
text    = "printf '\\033[38;2;120;220;255mhi from ansidrama\\033[0m\\n'"
hold_cs = 40
[[scene]]
keys    = ["Enter"]
hold_cs = 220
